name: detai35

services:
  # 1. Dịch vụ Nginx Reverse Proxy (HTTPS, Security Headers, định tuyến)
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-app
      - phpmyadmin
    networks:
      - frontend-net

  # 2. Dịch vụ Web App (Kết nối nội bộ, non-root user UID 1001)
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-app
    restart: unless-stopped
    user: "1001:1001"
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=SecureAppPass_2026!#
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

  # 3. Dịch vụ Database MySQL 8.0 (Volume lưu trữ bền vững, mật khẩu mạnh, cô lập mạng)
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass_2026!#
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: SecureAppPass_2026!#
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-net

  # 4. Dịch vụ phpMyAdmin (Quản lý Database MySQL qua giao diện web, URL prefix /pma/)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/pma/
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

# Volume lưu trữ bền vững cho Database
volumes:
  db_data:
    driver: local

# 2 mạng tách biệt theo tiêu chí Network Isolation
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

#Tài khoản Root (Toàn quyền quản trị cao nhất):Tài khoản: root Mật khẩu: RootSecurePass_2026!#   
#Tài khoản Ứng dụng (App user):Tài khoản: app_user   Mật khẩu: SecureAppPass_2026!#   
