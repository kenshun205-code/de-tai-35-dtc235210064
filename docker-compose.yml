name: detai35

services:
  # 1. Dịch vụ Nginx Reverse Proxy (HTTPS, Security Headers, định tuyến)
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - web-app
      - phpmyadmin
    networks:
      - frontend-net

  # 2. Dịch vụ Web App (Kết nối nội bộ, non-root user UID 1001)
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-app
    restart: unless-stopped
    user: "1001:1001"
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=SecureAppPass_2026!#
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

  # 3. Dịch vụ Database MySQL 8.0 (Volume lưu trữ bền vững, mật khẩu mạnh, cô lập mạng)
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass_2026!#
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: SecureAppPass_2026!#
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    networks:
      - backend-net

  # 4. Dịch vụ phpMyAdmin (Quản lý Database MySQL qua giao diện web, URL prefix /pma/)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/pma/
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

  # 5. Dịch vụ Prometheus (Thu thập và lưu trữ metrics, kết nối backend-net)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - backend-net

  # 6. Dịch vụ cAdvisor (Thu thập thông số container, kết nối backend-net)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    networks:
      - backend-net

  # 7. Dịch vụ Grafana (Hiển thị Dashboard trực quan hóa, mở port 3001:3000, volume bền vững grafana_data)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend-net
      - backend-net

  # 8. Dịch vụ Loki (Centralized Logging - Thu thập và lưu trữ log tập trung)
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - backend-net

  # 9. Dịch vụ Promtail (Thu thập log container từ Docker Socket gửi về Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    depends_on:
      - loki
    networks:
      - backend-net

# Volume lưu trữ bền vững cho Database, Grafana và Loki
volumes:
  db_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

# 2 mạng tách biệt theo tiêu chí Network Isolation
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# Tài khoản quản trị cơ sở dữ liệu:
# - Root (Toàn quyền quản trị): root / RootSecurePass_2026!#
# - Web App (Quyền ứng dụng): app_user / SecureAppPass_2026!#
