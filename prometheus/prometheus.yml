global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Thu thập metrics từ chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Thu thập metrics container (CPU, RAM, Network, I/O) từ cAdvisor
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
